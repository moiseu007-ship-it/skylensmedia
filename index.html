<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>SkyLens Media</title>
<meta name="description" content="SkyLens Media: professional 4K HDR drone filming for real estate, events, construction and social media. CZ / EN / UA.">
<meta property="og:type" content="website">
<meta property="og:title" content="SkyLens Media | Professional 4K HDR Aerial Filming">
<meta property="og:description" content="Real estate, promo videos, events, construction and Reels/TikTok content from above.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%81%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js');</script>
<style>
  :root{
    --bg:#0A0A0A; --surface:#111111; --surface2:#181818; --blue:#1A1A1A;
    --line:rgba(255,255,255,.16); --text:#F5F5F5; --muted:#A6A6A6;
    --accent:#FF5A00; --accent-ink:#0A0A0A; --sky:#FFFFFF; --bad:#FF6B6B;
    --font-display:'Oswald','Arial Narrow',Impact,sans-serif;
    --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color-scheme:dark;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{overflow-x:hidden; overflow-x:clip; max-width:100%; scroll-behavior:smooth; scroll-padding-top:calc(84px + env(safe-area-inset-top,0px)); background:var(--bg);}
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:hidden; overflow-x:clip; max-width:100%;}
  h1,h2,h3{font-family:var(--font-display); font-weight:700; line-height:1.12; margin:0; letter-spacing:-.01em;}
  p{margin:0;}
  a{color:inherit; text-decoration:none;}
  :focus-visible{outline:2px solid var(--sky); outline-offset:3px; border-radius:6px;}
  .wrap{max-width:1160px; margin-inline:auto; padding-inline:20px;}
  .section{padding-block:96px;}
  .section-head{max-width:640px; margin-bottom:44px;}
  .section-head h2{font-size:clamp(1.55rem,3.2vw,2.3rem);}
  .section-head p{color:var(--muted); margin-top:14px; max-width:60ch;}
  svg.i{width:1.25rem; height:1.25rem; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}

  /* header */
  .site-header{position:sticky; top:env(safe-area-inset-top,0px); z-index:50; background:rgba(10,10,10,.78); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line);}
  .site-header .bar{min-height:64px; padding-block:8px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .site-header .bar > *{min-width:0;}
  .bar-right{display:flex; align-items:center; gap:10px; flex:none;}
  .logo{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:1rem; white-space:nowrap; flex:none;}
  .head-cta, .panel-cta{white-space:nowrap;}
  @media (max-width:420px){ .logo{font-size:.88rem; gap:8px;} .lang button{padding:6px 8px; font-size:.74rem;} .bar-right{gap:8px;} .wrap{padding-inline:16px;} .nav{padding-inline:16px;} .form-card{padding:24px 18px;} }
  .logo-dot{width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 14px var(--accent);}
  .nav{display:none; position:absolute; left:0; right:0; top:100%; flex-direction:column; gap:2px; padding:12px 20px 20px; background:var(--surface); border-bottom:1px solid var(--line);}
  .nav.open{display:flex;}
  .nav a{padding:12px 6px; color:var(--muted); font-weight:600; font-size:.95rem; transition:color .2s;}
  .nav a:hover{color:var(--text);}
  .nav .panel-cta{display:inline-flex; margin-top:10px; justify-content:center; color:var(--accent-ink);}
  .nav .panel-cta:hover{color:var(--accent-ink);}
  .head-cta{display:none;}
  .menu-btn{display:inline-flex; align-items:center; justify-content:center; width:42px; height:42px; border-radius:12px; border:1px solid var(--line); background:var(--surface2); color:var(--text); cursor:pointer;}
  .lang{display:inline-flex; padding:3px; border:1px solid var(--line); border-radius:999px; background:var(--surface);}
  .lang button{border:0; background:none; color:var(--muted); font:600 .78rem var(--font-body); padding:6px 11px; border-radius:999px; cursor:pointer; transition:background .2s,color .2s;}
  .lang button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink);}
  @media (min-width:900px){ .head-cta{display:inline-flex;} .nav .panel-cta{display:none;} }
  @media (min-width:1100px){
    .nav{display:flex; position:static; flex-direction:row; gap:26px; padding:0; background:none; border:0;}
    .nav a{padding:6px 0; font-size:.9rem;}
    .menu-btn{display:none;}
  }

  /* buttons */
  .btn{display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:999px; font:700 .92rem var(--font-body); border:1px solid transparent; cursor:pointer; transition:transform .2s, box-shadow .2s, background .2s, border-color .2s;}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-primary:hover{transform:translateY(-2px); box-shadow:0 10px 30px -8px rgba(255,90,0,.7);}
  .btn-ghost{border-color:var(--line); background:rgba(24,24,24,.6); color:var(--text);}
  .btn-ghost:hover{border-color:var(--sky); box-shadow:0 0 0 1px rgba(255,255,255,.35), 0 10px 30px -12px rgba(255,255,255,.6);}
  .justify-center{justify-content:center;}
  .btn[disabled]{opacity:.6; cursor:not-allowed; transform:none;}

  /* cards */
  .card{position:relative; border:1px solid var(--line); border-radius:16px; background:linear-gradient(180deg,var(--surface2),var(--surface)); transition:transform .3s, border-color .3s, box-shadow .3s;}
  .card:hover{transform:translateY(-4px); border-color:rgba(255,90,0,.55); box-shadow:0 0 0 1px rgba(255,90,0,.25), 0 18px 44px -18px rgba(255,90,0,.45);}
  .ico{display:grid; place-items:center; width:44px; height:44px; border-radius:12px; background:rgba(255,255,255,.12); color:var(--sky); border:1px solid rgba(255,255,255,.25);}
  .ico svg{width:1.3rem; height:1.3rem;}

  /* hero */
  .hero{position:relative; padding-block:72px 88px; background:
      radial-gradient(900px 520px at 85% 0%, rgba(255,90,0,.85), transparent 70%),
      radial-gradient(600px 400px at 0% 100%, rgba(255,90,0,.45), transparent 70%), var(--bg);}
  .hero-grid{display:grid; gap:48px; align-items:center;}
  .hero-grid > *, .price-grid > *, .adv-grid > *, .srv-grid > *{min-width:0;}
  @media (min-width:960px){ .hero-grid{grid-template-columns:1.05fr .95fr;} }
  .hero-title{font-size:clamp(1.6rem,6.4vw,3.3rem); overflow-wrap:normal; hyphens:none;}
  .hero-sub{overflow-wrap:break-word;}
  .hero-title span{display:block;}
  .hero-title .hero-title-2{margin-top:10px; font-size:.62em; color:var(--accent); letter-spacing:0;}
  .hero-sub{margin-top:22px; max-width:52ch; color:var(--muted); font-size:1.08rem;}
  .hero-actions{display:flex; flex-wrap:wrap; gap:12px; margin-top:32px;}

  .hud{position:relative; border-radius:24px; border:1px solid var(--line); overflow:hidden; aspect-ratio:4/3.3; background:#0a0a0a;}
  .hud .ground{position:absolute; inset:0; width:100%; height:100%;}
  .hud .pan{animation:pan 10s linear infinite;}
  .hud::after{content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.8) 100%), linear-gradient(180deg, rgba(255,90,0,.18), rgba(0,0,0,.35));}
  .hud .corner{position:absolute; z-index:3; width:22px; height:22px; border:2px solid var(--accent); opacity:.9;}
  .hud .c1{top:14px; left:14px; border-right:0; border-bottom:0;}
  .hud .c2{top:14px; right:14px; border-left:0; border-bottom:0;}
  .hud .c3{bottom:14px; left:14px; border-right:0; border-top:0;}
  .hud .c4{bottom:14px; right:14px; border-left:0; border-top:0;}
  .hud-top, .hud-bot{position:absolute; z-index:3; left:42px; right:42px; display:flex; justify-content:space-between; font:600 .78rem var(--font-body); letter-spacing:.04em; color:#f0f0f0;}
  .hud-top{top:20px;} .hud-bot{bottom:46px;}
  .rec{display:inline-flex; align-items:center; gap:8px;}
  .rec i{width:9px; height:9px; border-radius:50%; background:#ff3b3b; animation:blink 1.4s steps(2,start) infinite;}

  .stage{position:absolute; z-index:2; inset:2% 4% 14% 4%; perspective:900px; animation:arrive 1.4s cubic-bezier(.2,.8,.2,1) both;}
  .stage svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
  .stage .shadow{animation:shadowpulse 6s ease-in-out infinite;}
  .stage .tilt{position:absolute; inset:0; transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); transition:transform .25s ease-out; transform-style:preserve-3d;}
  .stage .fly{animation:hover 6s ease-in-out infinite;}
  .prop{transform-box:fill-box; transform-origin:center; animation:spin .3s linear infinite;}
  .prop.rev{animation-direction:reverse;}
  .gimbal{transform-box:fill-box; transform-origin:50% 80%; animation:sway 5s ease-in-out infinite;}
  .led{animation:blink 1.2s steps(2,start) infinite;}
  @keyframes pan{from{transform:translateY(-120px);}to{transform:translateY(0);}}
  @keyframes arrive{from{opacity:0; transform:translateY(-26px) scale(1.18);}to{opacity:1; transform:none;}}
  @keyframes hover{0%,100%{transform:translate(-7px,5px) rotateZ(-1.8deg);}50%{transform:translate(9px,-9px) rotateZ(1.8deg);}}
  @keyframes shadowpulse{0%,100%{transform:translate(6%,9%) scale(1); opacity:.85;}50%{transform:translate(8%,12%) scale(1.07); opacity:.6;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes sway{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}}
  @keyframes blink{50%{opacity:.2;}}
  @keyframes rise{from{opacity:0; transform:translateY(16px);}to{opacity:1; transform:none;}}

  .spec-card{position:relative; z-index:4; margin:-34px 16px 0; padding:14px; border-radius:18px; border:1px solid var(--line); background:rgba(255,255,255,.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .spec{display:flex; gap:10px; align-items:flex-start; padding:10px; border-radius:12px; background:rgba(24,24,24,.7); border:1px solid transparent; opacity:0; animation:rise .6s ease-out forwards; transition:border-color .25s, background .25s;}
  .spec:nth-child(1){animation-delay:.35s;} .spec:nth-child(2){animation-delay:.5s;} .spec:nth-child(3){animation-delay:.65s;} .spec:nth-child(4){animation-delay:.8s;}
  .spec:hover{border-color:rgba(255,90,0,.5); background:rgba(255,90,0,.07);}
  .spec b{display:block; font-family:var(--font-display); font-size:.8rem; line-height:1.3;}
  .spec span.d{display:block; margin-top:3px; font-size:.78rem; color:var(--muted); line-height:1.4;}
  .spec svg{color:var(--accent); margin-top:2px;}
  @media (max-width:420px){ .spec-card{grid-template-columns:1fr;} }

  /* reveal */
  .js .reveal{opacity:0; transform:translateY(20px); transition:opacity .7s ease, transform .7s ease; transition-delay:var(--d,0s);}
  .js .reveal.in{opacity:1; transform:none;}
  .js .reveal.card.in:hover{transform:translateY(-4px);}

  /* advantages & services */
  .adv-grid, .srv-grid{display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));}
  .adv-grid .card, .srv-grid .card{padding:26px;}
  .adv-grid h3, .srv-grid h3{font-size:1rem; margin:18px 0 10px;}
  .adv-grid p, .srv-grid p{color:var(--muted); font-size:.93rem;}

  /* pricing */
  .price-grid{display:grid; gap:20px; align-items:stretch; grid-template-columns:1fr;}
  @media (min-width:900px){ .price-grid{grid-template-columns:repeat(3,1fr);} }
  .plan{padding:30px 26px; display:flex; flex-direction:column;}
  .plan h3{font-size:1.1rem;}
  .plan .ptag{color:var(--muted); font-size:.88rem; margin-top:6px;}
  .plan .price{margin:22px 0 4px; font-family:var(--font-display); font-size:1.9rem; font-weight:700;}
  .plan .price small{font:600 .82rem var(--font-body); color:var(--muted); margin-right:6px;}
  .plan ul{list-style:none; margin:22px 0 28px; padding:0; display:grid; gap:12px; flex:1;}
  .plan li{display:flex; gap:10px; font-size:.92rem; color:#d6d6d6;}
  .plan li svg{color:var(--accent); margin-top:3px; width:1.05rem; height:1.05rem;}
  .plan.popular{border-color:rgba(255,90,0,.7); background:linear-gradient(180deg,rgba(255,90,0,.12),var(--surface2) 38%,var(--surface)); box-shadow:0 0 0 1px rgba(255,90,0,.3), 0 24px 60px -24px rgba(255,90,0,.55);}
  @media (min-width:900px){ .plan.popular{transform:translateY(-12px);} .js .reveal.plan.popular.in{transform:translateY(-12px);} .js .reveal.plan.popular.in:hover{transform:translateY(-16px);} }
  .badge{position:absolute; top:-13px; left:26px; padding:4px 14px; border-radius:999px; background:var(--accent); color:var(--accent-ink); font:700 .78rem var(--font-body);}
  .price-note{margin-top:28px; color:var(--muted); font-size:.88rem;}

  /* form */
  .form-card{padding:32px 28px; border-radius:22px; border:1px solid var(--line); background:linear-gradient(180deg,var(--surface2),var(--surface)); max-width:760px;}
  .field{display:grid; gap:6px; margin-bottom:18px;}
  .field label{font-weight:600; font-size:.88rem;}
  .field input, .field select, .field textarea{width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line); background:#0d0d0d; color:var(--text); font:500 .95rem var(--font-body); transition:border-color .2s, box-shadow .2s;}
  .field textarea{min-height:130px; resize:vertical;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--sky); box-shadow:0 0 0 3px rgba(255,255,255,.25);}
  .field[data-invalid="true"] input, .field[data-invalid="true"] select, .field[data-invalid="true"] textarea{border-color:var(--bad);}
  .err{min-height:1.1em; color:var(--bad); font-size:.82rem;}
  .two{display:grid; gap:0 18px; grid-template-columns:1fr;}
  @media (min-width:680px){ .two{grid-template-columns:1fr 1fr;} }
  .hp{position:absolute !important; left:-9999px; top:auto; width:1px; height:1px; overflow:hidden;}
  .captcha{display:flex; align-items:center; gap:14px; padding:14px; border:1px dashed rgba(255,255,255,.4); border-radius:14px; background:rgba(255,90,0,.25); margin-bottom:18px; flex-wrap:wrap;}
  .captcha .q{font-weight:700;}
  .captcha input{width:90px; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:#0d0d0d; color:var(--text); font:600 1rem var(--font-body); text-align:center;}
  .captcha .hint{margin-left:auto; font-size:.78rem; color:var(--muted);}
  .status{margin-top:16px; min-height:1.4em; font-weight:600; font-size:.92rem;}
  .status.ok{color:#5BE3A1;} .status.bad{color:var(--bad);}

  footer{border-top:1px solid var(--line); padding-block:36px; color:var(--muted); font-size:.85rem;}
  footer .wrap{display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px;}


  /* ===== Breaking-2 style: black / white / orange ===== */
  h1,h2,h3,.logo,.btn,.spec b,.stat b,.plan .price{font-family:var(--font-display); text-transform:uppercase; letter-spacing:.02em;}
  .logo-dot{width:14px; height:14px; border-radius:0; transform:skewX(-18deg); box-shadow:none;}
  .logo{font-size:1.15rem;}
  .nav a{text-transform:uppercase; letter-spacing:.08em; font-size:.82rem; font-weight:700; font-family:var(--font-display);}
  .nav a:hover{color:var(--accent);}
  .lang, .lang button, .seg{border-radius:0;}
  .btn{border-radius:0; font-weight:600; letter-spacing:.08em; padding:14px 26px; transform:skewX(-8deg);}
  .btn > *{display:inline-block; transform:skewX(8deg);}
  .btn-primary:hover{box-shadow:6px 6px 0 #fff;}
  .btn-ghost{background:transparent; border:2px solid #fff;}
  .btn-ghost:hover{background:#fff; color:#0a0a0a; border-color:#fff; box-shadow:none;}
  .card, .hud, .spec-card, .spec, .form-card, .plan, .ico, .field input, .field select, .field textarea, .captcha, .captcha input{border-radius:0;}
  .card{background:#121212; border-color:rgba(255,255,255,.14);}
  .card:hover{border-color:var(--accent); box-shadow:8px 8px 0 var(--accent); transform:translate(-4px,-4px);}
  .js .reveal.card.in:hover{transform:translate(-4px,-4px);}
  .ico{background:var(--accent); color:#0a0a0a; border:0; transform:skewX(-8deg);}
  .hero{background:repeating-linear-gradient(115deg, transparent 0 54px, rgba(255,90,0,.10) 54px 58px), radial-gradient(700px 420px at 90% 0%, rgba(255,90,0,.22), transparent 70%), #0a0a0a;}
  .hero-title{font-size:clamp(2.7rem,9.5vw,6.4rem); line-height:1.15; letter-spacing:-.005em; font-weight:700;}
  .hero-title .hero-title-2{font-size:.46em; color:var(--accent); margin-top:16px; line-height:1;}
  .hero-sub{color:#cfcfcf; border-left:6px solid var(--accent); padding-left:16px;}
  .hud{border:2px solid #fff;}
  .section-head h2{font-size:clamp(2.1rem,5.4vw,3.8rem); line-height:.98;}
  .section-head h2::after{content:""; display:block; width:84px; height:8px; background:var(--accent); margin-top:16px; transform:skewX(-18deg);}
  .spec-card{background:#0a0a0a; border:2px solid #fff;}
  .spec{background:#151515;}
  .plan{border:2px solid #fff; background:#0f0f0f;}
  .plan.popular{border-color:var(--accent); background:#161616; box-shadow:10px 10px 0 var(--accent);}
  .badge{border-radius:0; background:var(--accent); color:#0a0a0a; font-family:var(--font-display); text-transform:uppercase; letter-spacing:.06em;}
  .plan .price{font-size:2.4rem;}
  .form-card{border:2px solid #fff; background:#0f0f0f;}
  .filters button{border-radius:0;}
  .ticker{overflow:hidden; background:var(--accent); color:#0a0a0a; border-block:3px solid #fff;}
  .ticker-track{display:flex; width:max-content; animation:tick 30s linear infinite;}
  .ticker span{font-family:var(--font-display); font-weight:700; text-transform:uppercase; font-size:1.2rem; letter-spacing:.06em; padding:10px 0 10px 30px; white-space:nowrap;}
  .ticker span::after{content:"/"; margin-left:30px; opacity:.55;}
  @keyframes tick{to{transform:translateX(-50%);}}
  .shots-grid{display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));}
  .shot{padding:0 0 22px; overflow:hidden;}
  .shot-viz{aspect-ratio:5/3; background:#0d0d0d; border-bottom:2px solid #fff; background-image:repeating-linear-gradient(115deg, transparent 0 20px, rgba(255,255,255,.04) 20px 22px);}
  .shot-viz svg{width:100%; height:100%; display:block;}
  .shot h3{font-size:1.25rem; margin:18px 22px 6px;}
  .shot p{margin:0 22px; color:var(--muted); font-size:.92rem;}
  .travel{display:grid; gap:32px; align-items:center; padding:40px 32px; background:#0f0f0f; border:2px solid #fff;}
  @media (min-width:900px){ .travel{padding:56px;} }
  .travel h2{font-size:clamp(2rem,4.6vw,3.2rem); line-height:1;}
  .tr-sub{color:var(--muted); margin-top:14px; max-width:46ch;}
  .rate{display:flex; align-items:baseline; gap:12px; margin-top:22px;}
  .rate b{font-family:var(--font-display); font-size:clamp(5rem,16vw,9rem); line-height:.85; color:var(--accent);}
  .rate span{font-family:var(--font-display); text-transform:uppercase; font-size:1.5rem;}
  .calc{display:grid; gap:12px;}
  .calc label{font-weight:700; font-size:.9rem;}
  .calc input{width:100%; padding:14px; background:#0d0d0d; color:#fff; border:2px solid #fff; border-radius:0; font:700 1.6rem var(--font-display);}
  .calc input:focus{outline:none; border-color:var(--accent);}

  .stepper{display:grid; grid-template-columns:56px 1fr 56px; border:2px solid #fff;}
  .stepper button{background:transparent; color:#fff; border:0; font:700 1.8rem var(--font-display); cursor:pointer; transition:background .2s,color .2s;}
  .stepper button:hover{background:var(--accent); color:#0a0a0a;}
  .stepper-val{display:flex; align-items:baseline; justify-content:center; gap:8px; padding:10px; border-inline:2px solid #fff;}
  .calc .stepper-val input{width:3.2ch; padding:0; border:0; background:transparent; text-align:right; font:700 2.4rem var(--font-display); color:#fff;}
  .stepper-val span{font:600 1rem var(--font-display); text-transform:uppercase; color:var(--muted);}
  .range{-webkit-appearance:none; appearance:none; width:100%; height:28px; background:transparent; cursor:pointer; --pct:10%;}

const HTML_LANG = {cz:'cs', en:'en', ua:'uk'};
const $  = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));
let LANG = 'ua';
const t = (k,vars) => { let s = (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k; if(vars){ for(const v in vars) s = s.replace('{'+v+'}', vars[v]); } return s; };
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------------- Language ---------------- */
function applyLang(l){
  if(!I18N[l]) l='en';
  LANG = l;
  document.documentElement.lang = HTML_LANG[l];
  document.title = t('meta.title');
  $$('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  $$('[data-i18n-ph]').forEach(el=>{ el.setAttribute('placeholder', t(el.dataset.i18nPh)); });
  $$('[data-i18n-aria]').forEach(el=>{ el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  $$('.lang button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.lang===l)));
  renderCaptchaText();
  renderErrors();
  try{ localStorage.setItem('skylens_lang', l); }catch(e){}
}
$$('.lang button').forEach(b=>b.addEventListener('click',()=>applyLang(b.dataset.lang)));

/* ---------------- Scroll reveal ---------------- */
(function(){
  const els = $$('.reveal');
  if(!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('in')); return; }
  const io = new IntersectionObserver((entries)=>{ entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } }); },{threshold:.12, rootMargin:'0px 0px -40px 0px'});
  els.forEach(e=>io.observe(e));
})();

/* ---------------- Hero HUD: timer, altitude, pointer tilt ---------------- */
(function(){
  let s = 12, a = 0; const rec = $('#recTime'), alt = $('#altVal');
  setInterval(()=>{ s = (s+1) % 3600; rec.textContent = '00:'+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); a += .9; alt.textContent = String(80 + Math.round(Math.sin(a)*3)); }, 1000);
  const hud = $('#hud'), tilt = $('#tilt');
  hud.addEventListener('pointermove', e=>{
    const r = hud.getBoundingClientRect(), x = (e.clientX-r.left)/r.width-.5, y = (e.clientY-r.top)/r.height-.5;
    tilt.style.setProperty('--ry', (x*14).toFixed(1)+'deg'); tilt.style.setProperty('--rx', (-y*12).toFixed(1)+'deg');
  });
  hud.addEventListener('pointerleave', ()=>{ tilt.style.setProperty('--ry','0deg'); tilt.style.setProperty('--rx','0deg'); });
})();

/* ---------------- Contact form + anti-fraud ---------------- */
const form = $('#leadForm'), statusEl = $('#formStatus'), submitBtn = $('#submitBtn');
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwr_EIt5txoivz8SON1EDLnxYjoeaTZMKm1mVsLFVlCSOk0fLtqTmZDiGtII24LEe3dVQ/exec'; // Google Apps Script web app -> Google Sheets
let cap = {a:0,b:0}, startedAt = 0;
const errState = {}; let statusState = null;

function rnd(n){ if(window.crypto && crypto.getRandomValues){ const u=new Uint32Array(1); crypto.getRandomValues(u); return u[0]%n; } return Math.floor(Math.random()*n); }
function newCaptcha(){ cap.a = 2+rnd(8); cap.b = 2+rnd(8); $('#captcha').value=''; renderCaptchaText(); }
function renderCaptchaText(){ $('#captchaQ').textContent = t('cap.q',{a:cap.a,b:cap.b}); }

function setErr(field,key,vars){ errState[field] = key ? {key,vars} : null; renderErrors(); }
function renderErrors(){
  $$('[data-err]').forEach(p=>{
    const f = p.dataset.err, e = errState[f];
    p.textContent = e ? t(e.key,e.vars) : '';
    const wrap = p.closest('.field'); if(wrap) wrap.dataset.invalid = e ? 'true' : 'false';
  });
  if(statusState){ statusEl.textContent = t(statusState.key,statusState.vars); statusEl.className = 'status '+statusState.type; } else { statusEl.textContent=''; statusEl.className='status'; }
}
function setStatus(type,key,vars){ statusState = key ? {type,key,vars} : null; renderErrors(); }

const UNSAFE = /<|>|javascript:|vbscript:|data:text|on[a-z]+\s*=|&#x?[0-9a-f]+;|\bscript\b|\beval\s*\(|\bdocument\.(cookie|write)/i;
const cleanLine = s => String(s||'').replace(/[\u0000-\u001F\u007F]/g,' ').replace(/\s+/g,' ').trim();
const cleanText = s => String(s||'').replace(/[\u0000-\u0009\u000B-\u001F\u007F]/g,' ').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
const EMAIL = /^[A-Za-z0-9._%+\-]{1,64}@[A-Za-z0-9\-]+(\.[A-Za-z0-9\-]+)*\.[A-Za-z]{2,}$/;
const PHONE = /^\+?[0-9\s\-().]{9,20}$/;
function validContact(v){
  if(UNSAFE.test(v)) return 'err.unsafe';
  if(v.includes('@')) return EMAIL.test(v) && v.length<=120 ? null : 'err.contact';
  if(!PHONE.test(v)) return 'err.contact';
  const digits = v.replace(/\D/g,''); return digits.length>=9 && digits.length<=15 ? null : 'err.contact';
}

/* client-side rate limit: min 60 s between sends, max 3 per hour */
const RL_KEY='skylens_lead_times'; let memTimes=[];
function getTimes(){ try{ const raw=localStorage.getItem(RL_KEY); const a=raw?JSON.parse(raw):[]; return Array.isArray(a)?a.filter(n=>typeof n==='number'):memTimes; }catch(e){ return memTimes; } }
function saveTimes(a){ memTimes=a; try{ localStorage.setItem(RL_KEY, JSON.stringify(a)); }catch(e){} }
function rateWait(){
  const now=Date.now(), h=getTimes().filter(x=>now-x<3600000);
  if(h.length>=3) return Math.ceil((3600000-(now-h[0]))/1000);
  const last=h[h.length-1]; if(last && now-last<60000) return Math.ceil((60000-(now-last))/1000);
  return 0;
}

form.addEventListener('focusin',()=>{ if(!startedAt) startedAt = Date.now(); });
['name','contact','package','message','captcha'].forEach(f=>{
  const el = f==='contact' ? $('#contact-input') : $('#'+f);
  el.addEventListener('input',()=>{ if(errState[f]) setErr(f,null); });
});

  /* UTM tags: remembered for the current visit only, sent with the form */
const UTM_KEYS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'];
let utmMem = {};
(function(){
  try{
    const q = new URLSearchParams(location.search), o = {};
    UTM_KEYS.forEach(k=>{ const v = q.get(k); if(v) o[k] = v.slice(0,100); });
    if(Object.keys(o).length){ utmMem = o; try{ sessionStorage.setItem('skylens_utm', JSON.stringify(o)); }catch(e){} }
    else { try{ const raw = sessionStorage.getItem('skylens_utm'); if(raw) utmMem = JSON.parse(raw) || {}; }catch(e){} }
  }catch(e){}
})();
const getUtm = () => Object.assign({}, utmMem, {referrer:(document.referrer||'').slice(0,200)});
function deliver(payload){
  if(!ENDPOINT) return Promise.resolve();
  return fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
}

form.addEventListener('submit', async e=>{
  e.preventDefault();
  Object.keys(errState).forEach(k=>errState[k]=null); setStatus(null);

  // a) honeypot: bots fill it. Pretend success, send nothing.
  if($('#website').value.trim()!==''){ form.reset(); newCaptcha(); startedAt=0; setStatus('ok','ok'); return; }

  // b) rate limit
  const wait = rateWait();
  if(wait>0){ setStatus('bad','err.rate',{s:wait}); return; }

  // d) strict validation
  const name = cleanLine($('#name').value), contact = cleanLine($('#contact-input').value),
        pkg = $('#package').value, msg = cleanText($('#message').value);
  let first = null;
  if(name.length<2 || name.length>60){ errState.name={key:'err.name'}; first=first||'#name'; }
  else if(UNSAFE.test(name)){ errState.name={key:'err.unsafe'}; first=first||'#name'; }
  const ce = validContact(contact); if(ce){ errState.contact={key:ce}; first=first||'#contact-input'; }
  if(!['social','commercial','event','custom'].includes(pkg)){ errState.package={key:'err.package'}; first=first||'#package'; }
  if(msg.length<10 || msg.length>1000){ errState.message={key:'err.message'}; first=first||'#message'; }
  else if(UNSAFE.test(msg)){ errState.message={key:'err.unsafe'}; first=first||'#message'; }

  // c) challenge
  if(parseInt($('#captcha').value.trim(),10)!==cap.a+cap.b){ errState.captcha={key:'err.captcha'}; first=first||'#captcha'; }
  if(first){ renderErrors(); $(first).focus(); return; }

  // timing check: humans need more than a few seconds to fill the form
  if(!startedAt || Date.now()-startedAt<4000){ setStatus('bad','err.fast'); return; }

  submitBtn.disabled = true;
  try{
   await deliver(Object.assign({name, contact, package:pkg, message:msg, lang:LANG, ts:new Date().toISOString()}, getUtm()));
    const now=Date.now(); saveTimes(getTimes().filter(x=>now-x<3600000).concat(now));
    form.reset(); startedAt=0; newCaptcha(); setStatus('ok','ok');
  }catch(err){
    setStatus('bad','err.rate',{s:30});
  }finally{ submitBtn.disabled = false; }
});

/* package buttons preselect the form */
$$('[data-pkg]').forEach(b=>b.addEventListener('click',()=>{
  $('#package').value = b.dataset.pkg; setErr('package',null);
  $('#contact').scrollIntoView({behavior:'smooth'});
  setTimeout(()=>$('#name').focus({preventScroll:true}), 600);
}));

    box.innerHTML = `<svg viewBox="0 0 200 120" aria-hidden="true"><path d="M0 108H200" stroke="#fff" stroke-opacity=".3"/>${subject}<path d="${path}" fill="none" stroke="#FF5A00" stroke-width="1.5" stroke-dasharray="3 4" opacity=".8"/><circle r="6" fill="#FF5A00" stroke="#fff" stroke-width="2"><animateMotion dur="${i===4?5:6}s" repeatCount="indefinite" path="${path}"/></circle></svg>`;
  });
  const tk = $('.ticker-track'); tk.innerHTML = tk.innerHTML.repeat(4);

/* ---------------- Init ---------------- */
paintIcons();
newCaptcha();
(function init(){
  let l = null;
  try{ l = localStorage.getItem('skylens_lang'); }catch(e){}
  if(!l || !I18N[l]){
    const n = (navigator.language||'en').toLowerCase();
    l = n.startsWith('cs') ? 'cz' : n.startsWith('uk') ? 'ua' : (n.startsWith('en') ? 'en' : 'ua');
  }
  applyLang(l);
  paintIcons();
})();
</script>
